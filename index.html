<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linify – Circular String Art</title>
<style>body{font-family:-apple-system,sans-serif;margin:12px;background:#f4f4f4;max-width:1100px}
fieldset{border:1px solid #ccc;border-radius:8px;margin:10px 0;background:#fff}label{display:inline-block;margin:6px 12px 6px 0}
input[type=number]{width:80px;font-size:16px}input[type=range]{width:150px;vertical-align:middle}
canvas{background:#fff;border:1px solid #ccc;margin:6px 0;max-width:100%;height:auto}
#prep{touch-action:none;cursor:grab;border-radius:50%}#steps{width:100%;height:200px;font-family:monospace}
button{margin:4px;font-size:16px;padding:8px 12px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}small{color:#666}</style></head><body>
<h2>Linify – circular string art</h2>
<p>Pins are numbered <b>0 to N-1</b>, pin 0 at the <b>top</b>, increasing <b>clockwise</b>. One continuous string starting at pin 0.</p>

<fieldset><legend><b>0. Generate from a prompt</b> <small>(optional, free, by Pollinations.ai)</small></legend>
<input id="prompt" placeholder="e.g. a happy golden retriever" style="width:100%;font-size:16px;padding:8px;box-sizing:border-box"><br>
<div id="chips"></div>
<label><input type="checkbox" id="sa" checked> String-art friendly style</label><br>
<button id="gen">✨ Generate</button><button id="again">🔄 Try another</button> <span id="genstatus"></span>
<div id="grid" style="display:flex;flex-wrap:wrap;gap:8px"></div></fieldset>
<style>.chip{border-radius:16px;background:#eef;border:1px solid #99c;font-size:14px;padding:6px 10px}.thumb{width:150px;text-align:center}.thumb img{width:150px;height:150px;object-fit:cover;border-radius:8px;display:block}</style>
<fieldset id="prepbox"><legend><b>1. Prepare image</b></legend>
<input type="file" id="file" accept="image/*"><br>
<label><input type="checkbox" id="bg"> Remove background (fill white)</label> <span id="bgstatus"></span><br>
<small>Drag to pan, pinch / mouse-wheel / slider to zoom.</small><br>
<div class="row"><canvas id="prep" width="500" height="500"></canvas>
<div>
<label>Zoom <input type="range" id="zoom" min="0.3" max="5" step="0.01" value="1"></label><br>
<label>Brightness <input type="range" id="bri" min="-0.5" max="0.5" step="0.01" value="0"></label><br>
<label>Contrast <input type="range" id="con" min="-0.9" max="0.9" step="0.01" value="0"></label><br>
<label>Gamma <input type="range" id="gam" min="0.3" max="3" step="0.01" value="1.2"></label><br>
<label><input type="checkbox" id="eq"> Equalize (contrast-limited)</label>
<label>clip <input type="range" id="clip" min="1" max="10" step="0.5" value="3" style="width:80px"></label><br>
<label>Sharpen / edges <input type="range" id="sharp" min="0" max="3" step="0.1" value="0"></label><br>
<label><input type="checkbox" id="inv"> Invert</label><br>
<label>Soften darks <input type="range" id="soft" min="0" max="1" step="0.05" value="0"></label><br>
<label><input type="checkbox" id="face"> <b>Emphasize face</b></label> <button id="focusbtn">🎯 Tap to set focus</button><br>
<label>Focus size <input type="range" id="frad" min="0.1" max="0.8" step="0.01" value="0.32"></label><br>
<label>Focus strength <input type="range" id="fstr" min="0" max="1" step="0.05" value="0.75"></label><br>
<button id="reset">Reset</button> <button id="use"><b>Use for string art ↓</b></button>
</div></div></fieldset>

<fieldset><legend><b>2. String art</b></legend>
<label>Pins <input type="number" id="pins" value="200"></label>
<label>Max lines <input type="number" id="lines" value="3000"></label>
<label><input type="checkbox" id="auto" checked> Auto-stop when no line helps</label>
<label>Frame diameter (cm) <input type="number" id="diam" value="50" step="1"></label>
<label>Thread thickness (mm) <input type="number" id="thr" value="0.25" step="0.05"></label>
<label>Hi-res PNG px <input type="number" id="hires" value="2000" step="100"></label>
<label>Image size px <input type="number" id="size" value="500"></label>
<label>Min pin skip <input type="number" id="skip" value="15"></label><br><small id="phys"></small><br>
<button id="go">Linify</button><button id="stop">Stop</button>
<button id="png">PNG</button><button id="txt">TXT</button><button id="csv">CSV</button>
<span id="status"></span><br>
<canvas id="out" width="500" height="500"></canvas>
<textarea id="steps" readonly></textarea></fieldset>
<script src="prep.js"></script><script src="engine.js"></script>
<script>
const $=id=>document.getElementById(id);let orig=null,cut=null,file=null,worker=null,steps=[],pins=[],S=500,prepped=null;
const view={zoom:1,ox:0,oy:0};
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
$('file').onchange=async e=>{file=e.target.files[0];if(!file)return;orig=await loadImg(URL.createObjectURL(file));cut=null;resetView();if($('bg').checked)await removeBg();draw();};
async function removeBg(){if(cut||!file)return;$('bgstatus').textContent='loading model & removing background (first time ~10-40s)…';
 try{const m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
  const blob=await m.removeBackground(file,{model:'isnet_quint8',output:{format:'image/png'},progress:(k,c,t)=>{if(t)$('bgstatus').textContent=`downloading ${k.split('/').pop()} ${Math.round(100*c/t)}%`;}});
  const fg=await loadImg(URL.createObjectURL(blob)),c=document.createElement('canvas');c.width=fg.width;c.height=fg.height;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(fg,0,0);cut=c;$('bgstatus').textContent='background removed ✓';}
 catch(err){console.error(err);$('bgstatus').textContent='background removal failed: '+err.message;$('bg').checked=false;}}
$('bg').onchange=async()=>{if($('bg').checked)await removeBg();draw();};
function resetView(){view.zoom=1;view.ox=0;view.oy=0;$('zoom').value=1;}
$('reset').onclick=()=>{resetView();for(const[id,v]of[['bri',0],['con',0],['gam',1.2],['sharp',0],['clip',3],['soft',0],['frad',0.32],['fstr',0.75]])$(id).value=v;$('eq').checked=$('inv').checked=$('face').checked=false;focus.x=0.5;focus.y=0.42;draw();};
let pending=false;function draw(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render();});}
function render(){S=+$('size').value;const c=$('prep');if(c.width!==S){c.width=c.height=S;}const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);
 const src=($('bg').checked&&cut)?cut:orig;if(!src)return;const w=src.width,h=src.height,base=S/Math.min(w,h),sc=base*view.zoom;
 x.drawImage(src,S/2+view.ox-w*sc/2,S/2+view.oy-h*sc/2,w*sc,h*sc);
 const id=x.getImageData(0,0,S,S);prepped=Prep.process(id.data,S,{brightness:+$('bri').value,contrast:+$('con').value,gamma:+$('gam').value,equalize:$('eq').checked,clip:+$('clip').value,sharpen:+$('sharp').value,invert:$('inv').checked,softenDarks:+$('soft').value});
 for(let i=0;i<S*S;i++){const v=prepped[i]*255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}x.putImageData(id,0,0);if($('face').checked){x.save();x.strokeStyle='rgba(255,0,0,.8)';x.lineWidth=2;x.setLineDash([6,4]);x.beginPath();x.arc(focus.x*S,focus.y*S,+$('frad').value*S,0,7);x.stroke();x.beginPath();x.arc(focus.x*S,focus.y*S,4,0,7);x.fillStyle='red';x.fill();x.restore();}}
const focus={x:0.5,y:0.42};let picking=false;$('focusbtn').onclick=()=>{picking=true;$('face').checked=true;$('focusbtn').textContent='👆 tap the face…';draw();};
for(const id of['bri','con','gam','eq','clip','sharp','inv','size','soft','face','frad','fstr'])$(id).addEventListener('input',draw);
$('zoom').addEventListener('input',()=>{view.zoom=+$('zoom').value;draw();});
// pan / pinch
const pts=new Map();let lastDist=0;const cv=$('prep');const k=()=>cv.width/cv.clientWidth;
cv.addEventListener('pointerdown',e=>{if(picking){const b=cv.getBoundingClientRect();focus.x=(e.clientX-b.left)/b.width;focus.y=(e.clientY-b.top)/b.height;picking=false;$('focusbtn').textContent='🎯 Tap to set focus';draw();return;}cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);lastDist=0;});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size===1){view.ox+=(e.clientX-p[0])*k();view.oy+=(e.clientY-p[1])*k();}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastDist)setZoom(view.zoom*d/lastDist);lastDist=d;}draw();});
const up=e=>{pts.delete(e.pointerId);lastDist=0;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(view.zoom*Math.exp(-e.deltaY/500));draw();},{passive:false});
function setZoom(z){view.zoom=Math.max(0.3,Math.min(5,z));$('zoom').value=view.zoom;}

// ---- Step 0: prompt generation (Pollinations, keyless, CORS *) ----
const HINT=', single subject centered, high contrast, black and white, plain white background, bold simple shapes, portrait, studio lighting';
const EX={'🐶 Pet portrait':'a cute dog portrait looking at the camera','🙂 Face':'portrait of a smiling woman, front view','🗼 Landmark':'the Eiffel Tower','🌻 Flower':'a single sunflower'};
for(const[k,v]of Object.entries(EX)){const b=document.createElement('button');b.className='chip';b.textContent=k;b.onclick=()=>{$('prompt').value=v;generate();};$('chips').appendChild(b);}
async function generate(){const p=$('prompt').value.trim();if(!p)return $('prompt').focus();const full=p+($('sa').checked?HINT:''),seed=Math.floor(Math.random()*1e6);
 const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(full)}?width=1024&height=1024&nologo=true&seed=${seed}`;
 const card=document.createElement('div');card.className='thumb';card.innerHTML='<div style="width:150px;height:150px;border-radius:8px;background:#ddd;display:flex;align-items:center;justify-content:center">⏳ generating…</div>';
 $('grid').prepend(card);$('genstatus').textContent='generating (10-30 s)…';
 try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const blob=await r.blob();const u=URL.createObjectURL(blob);
  card.innerHTML='';const im=new Image();im.src=u;const b=document.createElement('button');b.textContent='Use this image';
  b.onclick=async()=>{file=blob;orig=await loadImg(u);cut=null;resetView();if($('bg').checked)await removeBg();draw();$('prepbox').scrollIntoView({behavior:'smooth'});};
  card.append(im,b);$('genstatus').textContent='done ✓ (tap "Use this image")';}
 catch(e){card.innerHTML='<div style="width:150px;padding:20px 0">❌ failed<br><small>'+e.message+'</small></div>';$('genstatus').textContent='generation failed, try again';}}
$('gen').onclick=generate;$('again').onclick=generate;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')generate();});
// string art
function clearOut(){const c=$('out');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);x.strokeStyle='#ccc';x.beginPath();x.arc(S/2,S/2,S/2-0.5,0,7);x.stroke();return x;}
function start(){if(!orig)return alert('Upload an image first');render();if(worker)worker.terminate();const c0=(S-1)/2,dark=new Float32Array(S*S);
 for(let i=0;i<S*S;i++)if(Math.hypot(i%S-c0,(i/S|0)-c0)<=c0)dark[i]=1-prepped[i];const N=+$('pins').value;
 pins=Linify.pinsFor(N,S);steps=[];const x=clearOut();const w=lw(S);styleCtx(x,w);
 worker=new Worker('worker.js');worker.onmessage=e=>{const m=e.data;if(m.type==='progress'){for(const[a,b]of m.lines){x.beginPath();x.moveTo(...pins[a]);x.lineTo(...pins[b]);x.stroke();steps.push([a,b]);}$('status').textContent=' step '+steps.length+' / '+$('lines').value+' · thread ≈ '+threadM().toFixed(0)+' m';}
  else{$('status').textContent=' done: '+steps.length+' lines · thread ≈ '+threadM().toFixed(0)+' m';$('steps').value=txt();}};
 worker.postMessage({dark,size:S,opts:{pins:N,lines:+$('lines').value,alpha:Math.min(1,w),minSkip:+$('skip').value,autoStop:$('auto').checked,weight:$('face').checked?Linify.weightMap(S,focus.x,focus.y,+$('frad').value,1-(+$('fstr').value)):undefined}},[dark.buffer]);}
$('go').onclick=start;$('use').onclick=()=>{start();$('out').scrollIntoView({behavior:'smooth'});};
$('stop').onclick=()=>{if(worker){worker.terminate();worker=null;$('steps').value=txt();$('status').textContent=' stopped at '+steps.length;}};
const txt=()=>`Pins numbered 0-${pins.length-1}, pin 0 at top, clockwise. Start at pin 0.\nFrame ${$('diam').value} cm, thread ${$('thr').value} mm, ${steps.length} lines, estimated thread length ${threadM().toFixed(1)} m (chords only, add slack for wrapping pins).\n`+steps.map((s,i)=>`Step ${i+1}: pin ${s[0]} -> pin ${s[1]}`).join('\n');
const csv=()=>'step,from_pin,to_pin\n'+steps.map((s,i)=>`${i+1},${s[0]},${s[1]}`).join('\n');
function dl(name,href){const a=document.createElement('a');a.download=name;a.href=href;a.click();}
$('png').onclick=()=>{const R=+$('hires').value||S,c=document.createElement('canvas');c.width=c.height=R;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,R,R);
 const P=Linify.pinsFor(pins.length,R);styleCtx(x,lw(R));for(const[a,b]of steps){x.beginPath();x.moveTo(...P[a]);x.lineTo(...P[b]);x.stroke();}dl('linify.png',c.toDataURL());};
// physical model: thread width in px = thread_mm / diameter_mm * px. Sub-pixel widths become alpha.
function lw(px){return (+$('thr').value)/((+$('diam').value)*10)*px;}
function styleCtx(x,w){x.lineWidth=Math.max(1,w);x.globalAlpha=Math.min(1,w);x.strokeStyle='#000';}
function threadM(){const N=pins.length,D=(+$('diam').value)/100;return steps.reduce((s,[a,b])=>s+Linify.chord(a,b,N,D),0);}
function showPhys(){const w=lw(+$('size').value);$('phys').textContent=`Thread = ${w.toFixed(3)} px at ${$('size').value} px → each line drawn at ${(Math.min(1,w)*100).toFixed(0)}% opacity, ${Math.max(1,w).toFixed(2)} px wide`;}
for(const id of['diam','thr','size'])$(id).addEventListener('input',showPhys);showPhys();
$('txt').onclick=()=>dl('linify_steps.txt',URL.createObjectURL(new Blob([txt()],{type:'text/plain'})));
$('csv').onclick=()=>dl('linify_steps.csv',URL.createObjectURL(new Blob([csv()],{type:'text/csv'})));
</script></body></html>
